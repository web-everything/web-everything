# Deploy the gated WE site to its Cloudflare Worker — ONLY for a commit whose required checks are green (#1137).
#
# WHY THIS IS NOT `on: push` ANY MORE (#xmiuo0r). The push trigger fired this workflow in PARALLEL with CI, on
# every push to `main`, and deployed whatever `main` happened to be at deploy time — regardless of whether CI
# passed, and regardless of whether the tree it built was the tree CI tested. Under a fast drain those are
# routinely DIFFERENT commits. Branch protection never covered this: `strict`/required checks gate a MERGE,
# not a push-triggered deploy, so the hole existed at `strict: true` too and simply became more likely to be
# hit once `strict` was turned off.
#
# THE TWO HALVES, and why both are needed:
#   1. TRIGGER — `workflow_run` on successful CI or a proven queue-reuse failure, and check out its head SHA. This is what
#      makes the deploy build the exact commit CI verified rather than the branch tip. The job `if:` ALSO
#      requires `workflow_run.event == 'push'` and a head repository equal to this one; see the admission
#      comment on the job — those clauses are load-bearing security, not tidiness.
#   2. ENFORCEMENT — the "Refuse an unverified SHA" step below re-derives, from the API, BOTH that the SHA is
#      an ancestor of `main` and that `test`/`smoke`/`daemon-soak` are green on their LATEST run for it (for a
#      reused push: green in the certifying queue run's suite AND as the latest real execution). It exits non-zero
#      unless both hold. This mirrors the sole-writer rule the drain already follows
#      (`docs/agent/platform-decisions.md#event-driven-land-is-wake-only` clause 1): *a wake signal is never a
#      trusted land order — the gate is still re-derived server-side*. Same principle, applied to deploy.
#
# WHAT ACTUALLY GUARDS THIS — a RETRACTION (review of PR #1611). An earlier revision of this header said:
#
#     "The trigger is wiring and can be mis-configured or bypassed (`workflow_dispatch`); the re-derive is
#      the actual guarantee."
#
# THAT WAS WRONG, and it was wrong in the direction that matters — it dismissed as "wiring" the half that was
# in fact the only thing standing between a fork and this job's production secrets. Two corrections:
#
#   • The trigger filter is NOT merely wiring. `workflow_run.branches: [main]` matches `head_branch`, a branch
#     NAME on the HEAD repo — not the head repository, and not ancestry on main. A fork PR whose source branch
#     is named `main` satisfied it, and the job `if:` then checked only `conclusion == 'success'`. Nothing
#     examined `head_repository` or `workflow_run.event`. That is a route to running fork-authored code in a
#     job holding FUI_READ_TOKEN + CLOUDFLARE_API_TOKEN, in a PUBLIC repo. Closed by the job `if:` below.
#
#   • The re-derive was NOT the guarantee claimed. As originally written it asked only "did this SHA ever have
#     green test+smoke?", which a PR head satisfies just as well as a merged commit — demonstrated live during
#     review against a non-ancestor PR SHA. It is a guarantee of green checks, never of being a commit on
#     main. The ancestry assertion added to the gate is what makes the re-derive mean what this file claims.
#
# Stated correctly: the trigger filter and the re-derive are BOTH load-bearing, and neither subsumes the other.
#
# FUI PIN (closes the #xd6hbxe gap, PR #7224): every main-push CI run records the FUI revision its jobs checked
# out (artifact `fui-sibling-<sha>`). The deploy checks out exactly that revision ("Resolve certified FUI
# revision"); a missing or ambiguous record refuses the deploy unless break glass is set.
#
# CROSS-REPO build: WE's `build:docs` shells out to FUI's component-render tool
# (../frontierui/dist/tools/component-render/cli.mjs, ratified ordering #1946/#2016), so CI must
# check out BOTH repos as siblings and build FUI's tools first. Single-repo CI cannot build this site.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   WE_APP_PRIVATE_KEY    — GitHub App private key (var WE_APP_ID = app id); app installed on frontier-ui/frontierui, Contents:Read; preferred
#   FUI_READ_TOKEN        — fallback fine-grained PAT, Contents:Read on frontier-ui/frontierui (used only if WE_APP_ID unset)
#   CLOUDFLARE_API_TOKEN  — scoped token, Workers Scripts · Edit (deploy)
#   CLOUDFLARE_ACCOUNT_ID — the account id
name: Deploy WE site (Cloudflare Worker)

on:
  # Fires when CI COMPLETES on main. Success or a proven reuse-only failure is admitted below;
  # `types: [completed]` is the only type that carries a conclusion.
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      break_glass:
        description: "Deploy even if the SHA's required checks are not green (emergency only — say why in the run notes)"
        type: boolean
        default: false

concurrency:
  group: deploy-worker
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  deploy:
    # ADMISSION: a successful CI run is NOT sufficient on its own — see the "WHAT ACTUALLY GUARDS THIS"
    # note in the header. `workflow_run.branches: [main]` filters on `head_branch`, a BRANCH NAME on the HEAD
    # repo, so a FORK pull request whose source branch is literally named `main` matches it. Without the two
    # extra clauses below, that fork's SHA would reach `Checkout WE` and its code would run in a job holding
    # FUI_READ_TOKEN + CLOUDFLARE_API_TOKEN. This repo is PUBLIC. Same class the repo already refuses by name
    # in `apply-review-request.yml:26` and `stage-pr-view.yml:20` ("Deliberately NOT pull_request_target, and
    # it never checks out a fork's ref: both are the classic routes to running untrusted code with a write
    # token"). `event == 'push'` excludes PR-triggered CI runs; `head_repository.full_name == repository`
    # excludes forks outright.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      statuses: read
      actions: read
    env:
      # workflow_run → the commit CI actually tested. workflow_dispatch → the branch tip at dispatch time.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Reused pushes deliberately fail main-execution to withhold fresh main-green
      # evidence. Admit only that failure, with complete evidence from its own attempt.
      # This runs before checkout, app-token creation, or any production secret use.
      # The proof mirrors scripts/lib/main-ci-reuse-runs.mjs#isReusedJobsPage (no checkout exists yet).
      # It also names the queue run whose execution the reuse certified: the gate below binds the
      # required checks to THAT check suite, since the reused push's own required jobs are skipped.
      - name: Verify reused CI failure
        id: reuse
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.run_attempt !== 1) {
              core.setFailed('Cannot deploy an unproven failed CI rerun');
              return;
            }
            const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt({
              ...context.repo, run_id: run.id, attempt_number: 1, per_page: 100,
            });
            const jobs = data.jobs;
            const markers = Array.isArray(jobs) ? jobs.filter(job => job.name === 'main-execution') : [];
            const steps = markers[0]?.steps;
            const reuseStep = 'Queue CI reused (no fresh main execution)';
            const reused = Array.isArray(jobs) && jobs.length > 0 && data.total_count === jobs.length
              && markers.length === 1 && markers[0].conclusion === 'failure'
              && Array.isArray(steps) && steps.some(step => step.name === reuseStep && step.conclusion === 'failure')
              && steps.every(step => step.name === reuseStep || step.conclusion !== 'failure')
              && jobs.every(job => job.status === 'completed' && job.run_attempt === 1
                && (job === markers[0] || ['success', 'skipped'].includes(job.conclusion)));
            if (!reused) {
              core.setFailed('CI failure is not proven queue reuse; refusing deploy');
              return;
            }
            const queue = (await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo, head_sha: run.head_sha, event: 'merge_group', per_page: 100,
            })).data;
            const rows = Array.isArray(queue?.workflow_runs) ? queue.workflow_runs : null;
            const certified = rows && queue.total_count === rows.length ? rows.filter(r => r.path === '.github/workflows/ci.yml'
              && r.head_sha === run.head_sha && String(r.head_branch ?? '').startsWith('gh-readonly-queue/main/')
              && r.status === 'completed' && r.conclusion === 'success').sort((a, b) => b.id - a.id)[0] : null;
            if (!certified || !Number.isSafeInteger(certified.check_suite_id) || certified.check_suite_id <= 0) {
              core.setFailed('No complete, successful queue run certifies this reused SHA; refusing deploy');
              return;
            }
            core.setOutput('queue_suite', String(certified.check_suite_id));
      # FUI is a separate repo: CI records the exact sibling revision its jobs checked out (artifact
      # fui-sibling-<sha>). Deploy builds THAT revision, never a later untested FUI tip.
      - name: Resolve certified FUI revision
        id: certified-fui
        uses: actions/github-script@v7
        env:
          BREAK_GLASS: ${{ inputs.break_glass }}
        with:
          script: |
            const sha = process.env.DEPLOY_SHA;
            const refuse = message => {
              if (process.env.BREAK_GLASS === 'true') { core.warning(`BREAK GLASS — ${message}; FUI unpinned`); core.setOutput('sha', ''); }
              else core.setFailed(message);
            };
            let runId = context.payload.workflow_run?.id;
            if (!runId) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', status: 'completed', per_page: 100,
              });
              const rows = Array.isArray(data?.workflow_runs) ? data.workflow_runs : [];
              runId = rows.filter(r => r.head_sha === sha && r.event === 'push' && r.path === '.github/workflows/ci.yml')
                .sort((a, b) => b.id - a.id)[0]?.id;
            }
            if (!Number.isSafeInteger(runId) || runId <= 0) return refuse(`no CI push run certifies ${sha}`);
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: runId, per_page: 100 });
            const all = Array.isArray(data?.artifacts) && data.total_count === data.artifacts.length ? data.artifacts : null;
            const records = (all ?? []).filter(a => typeof a?.name === 'string' && a.name.startsWith('fui-sibling-'));
            const fui = records.length === 1 && records[0].expired === false
              && /^fui-sibling-([0-9a-f]{40})$/.exec(records[0].name)?.[1];
            if (!all || !fui) return refuse(`CI run ${runId} has no single unexpired certified FUI record`);
            core.setOutput('sha', fui);
      # ── THE GATE ─────────────────────────────────────────────────────────────────────────────────────────
      # Re-derive BOTH properties for DEPLOY_SHA instead of trusting how this workflow was triggered. Deploy-time
      # admission control: the deployer verifies the artifact, it does not take the caller's word for it.
      #
      # Two independent assertions, because green-checks alone does NOT mean "a commit on main":
      #   A. ANCESTRY — DEPLOY_SHA is an ancestor of (or identical to) `main`. Without this, ANY sha in the repo
      #      that happens to carry green `test`/`smoke` check-runs passes — including a pull-request HEAD that
      #      was never merged. Verified empirically during review: the checks-only pipeline returned ok=true for
      #      `fff10d794baeee884950a820e774b9acdaa830a5`, a PR head that is NOT an ancestor of main. The compare
      #      API's `status` is `behind` when the head is an ancestor of the base, `identical` when equal.
      #   B. REQUIRED CHECKS — `test`, `smoke` and `daemon-soak` are all green for that sha, taking the LATEST
      #      check-run per name. Every check-run is read (`filter=all`, paginated) and the jq reduces per name
      #      via `max_by(.started_at)`, so a green-then-red RE-RUN cannot be read as green by finding the
      #      stale success earlier in the list.
      #   C. REUSE — a reused push's own test/smoke/daemon-soak jobs are skipped. Its admission names the
      #      certified queue run (QUEUE_SUITE): every required check must be green IN that suite, and the
      #      latest real (non-skipped) execution of each name on the SHA must still be green, so a newer
      #      failure (e.g. an hourly soak) refuses the deploy. daemon-soak is required on every path.
      - name: Refuse an unverified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          BREAK_GLASS: ${{ inputs.break_glass }}
          QUEUE_SUITE: ${{ steps.reuse.outputs.queue_suite }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          echo "candidate: $DEPLOY_SHA"

          # A. Ancestry — is this sha actually ON main?
          rel=$(gh api "repos/${{ github.repository }}/compare/main...$DEPLOY_SHA" --jq '.status')
          echo "position vs main: $rel"
          case "$rel" in
            behind|identical) on_main=true ;;
            *)                on_main=false ;;
          esac

          # B. Required checks — LATEST run per required name must be success (C: see above).
          got=$(gh api --paginate "repos/${{ github.repository }}/commits/$DEPLOY_SHA/check-runs?filter=all&per_page=100" \
                  --jq '[.check_runs[] | select(.name=="test" or .name=="smoke" or .name=="daemon-soak")
                         | {name, conclusion, started_at, suite: (.check_suite.id | tostring)}]' | jq -s 'add // []')
          echo "required check-runs: $got"
          if [ "${RUN_CONCLUSION:-}" = "failure" ] && [ -z "${QUEUE_SUITE:-}" ]; then
            checks_ok=false
          else
            checks_ok=$(printf '%s' "$got" | jq -r --arg suite "${QUEUE_SUITE:-}" '
                   def green(rows): (rows | group_by(.name) | map(max_by(.started_at))
                     | map(select(.conclusion=="success") | .name) | unique) == ["daemon-soak","smoke","test"];
                   if $suite == "" then green(.)
                   else green(map(select(.conclusion != "skipped"))) and green(map(select(.suite == $suite))) end')
          fi

          if [ "$on_main" = "true" ] && [ "$checks_ok" = "true" ]; then
            echo "✓ $DEPLOY_SHA is on main and verified green — proceeding"
          elif [ "${BREAK_GLASS:-false}" = "true" ]; then
            echo "::warning::BREAK GLASS — deploying $DEPLOY_SHA (on_main=$on_main, checks_ok=$checks_ok)"
          else
            [ "$on_main"    = "true" ] || echo "::error::refusing to deploy $DEPLOY_SHA — it is not an ancestor of main (compare status: $rel)"
            [ "$checks_ok"  = "true" ] || echo "::error::refusing to deploy $DEPLOY_SHA — required checks (test, smoke, daemon-soak) are not all green for the certified execution"
            exit 1
          fi
      # ─────────────────────────────────────────────────────────────────────────────────────────────────────

      # Sibling layout under $GITHUB_WORKSPACE so WE's hardcoded `../frontierui` resolves:
      #   $GITHUB_WORKSPACE/web-everything  (this repo)
      #   $GITHUB_WORKSPACE/frontierui      (the tool sibling)
      - name: Checkout WE
        uses: actions/checkout@v4
        with:
          path: web-everything
          # THE POINT OF THIS CHANGE: build the commit CI verified, not the branch tip.
          ref: ${{ env.DEPLOY_SHA }}
      - name: Mint FUI read token (GitHub App)
        id: fui-app-token
        if: vars.WE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WE_APP_ID }}
          private-key: ${{ secrets.WE_APP_PRIVATE_KEY }}
          owner: frontier-ui
          repositories: frontierui
          permission-contents: read
      - name: Checkout FUI (sibling)
        uses: actions/checkout@v4
        with:
          repository: frontier-ui/frontierui
          # The sibling revision CI certified (empty only under an explicit break glass).
          ref: ${{ steps.certified-fui.outputs.sha }}
          token: ${{ steps.fui-app-token.outputs.token || secrets.FUI_READ_TOKEN }}
          path: frontierui

      - uses: actions/setup-node@v4
        with:
          node-version-file: web-everything/.nvmrc
          cache: npm
          cache-dependency-path: |
            web-everything/package-lock.json
            frontierui/package-lock.json

      # FUI tools first (ratified #1946/#2016 ordering) → produces dist/tools/component-render/cli.mjs
      - name: Build FUI tools
        working-directory: frontierui
        run: |
          npm ci
          npm run build:tools

      # WE site build (Eleventy calls the FUI CLI at ../frontierui/dist/tools/component-render/cli.mjs)
      - name: Build WE site
        working-directory: web-everything
        run: |
          npm ci
          npm run build:docs

      - name: Guard asset sizes
        working-directory: web-everything
        run: node scripts/check-site-asset-size.mjs _site

      - name: Deploy Worker + assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web-everything
          # Pin to the version verified to honor `run_worker_first = ["/*"]` (the boolean form leaked;
          # a version mismatch here previously served content un-gated). Bump only after re-verifying the gate.
          wranglerVersion: "4.106.0"
          command: deploy

      - name: Record what shipped
        run: echo "deployed $DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
