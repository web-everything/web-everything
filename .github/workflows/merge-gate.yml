# The `merge-gate` required check: every gate the drain (scripts/merge-ai-prs.mjs) applies right before its merge
# write, evaluated in CI so GitHub's native merge queue can do the merging (merge-delivery strategy
# `github-merge-queue`, scripts/lib/merge-delivery-policy.mjs). Decision logic: scripts/lib/merge-gate-ci.mjs
# (reuses the drain's own pure functions). Gate list + where each gate lives: scripts/lib/merge-gate-inventory.mjs
# (a test fails when the drain gains a gate this check does not account for).
#
# Runs on `pull_request` (so a PR can be added to the queue) and on `merge_group` (each PR in the group is
# re-evaluated against the group's commit right before GitHub merges it). `workflow_dispatch` is the dry run.
#
# SCRIPTS COME FROM MAIN, NEVER FROM THE PR (same rule and reasoning as review-gate.yml): a PR cannot neuter the
# gate's SCRIPTS by editing them in its diff. The PR's body, labels, comments and diff are read as data, and every
# git read is pinned to the PR's exact head SHA (the event's `pull_request.head.sha`, or for `merge_group` each PR's
# sha inside the group commit) — never the branch name; an unfetchable sha or a head that moved fails closed.
# No secret is exposed: the job has only the read-scoped GITHUB_TOKEN and never executes PR code.
# WHAT IS NOT PINNED BY THIS FILE: this workflow YAML. GitHub reads the workflow file from the PR's merge ref for
# `pull_request`, and from the group commit for `merge_group`, so a PR that edits this file changes what the
# required check does. Two layers:
#   (1) SELF-CHECK (in this repo): the evaluator (scripts from main) refuses to pass unless the RUNNING workflow
#       file (GITHUB_WORKFLOW_REF @ GITHUB_WORKFLOW_SHA) is byte-identical to main's — fail closed
#       (verifyRunningWorkflow in scripts/merge-gate-check.mjs). It cannot catch an edit that never reaches the
#       evaluator (the job made `exit 0`, or a new workflow whose job is named `merge-gate`).
#   (2) THE RULESET (the only defence for (1)'s gap — required before `merge-gate` is made required): the
#       ruleset's `workflows` rule pins every workflow that defines a required check to refs/heads/main
#       (rulesetSuggestion.requiredWorkflows in scripts/lib/merge-queue-enqueue.mjs), so GitHub runs them from main
#       rather than from the PR, and the required status checks are restricted to the GitHub Actions integration id
#       (requiredStatusCheckIntegrationId 15368) so no other app/token can post a green `merge-gate`. Print the
#       exact ruleset with `node scripts/merge-gate-check.mjs --print-ruleset`. A test fails when a workflow
#       defining a required check is not in that pin.
# Until the operator applies that ruleset, the guard the repo itself provides is the ENQUEUE refusal, which no PR can
# edit because it does not run in a workflow: enqueuePr (scripts/lib/merge-queue-enqueue.mjs) runs from the daemon's
# own main checkout and refuses, for a HUMAN (humanOnly, not an escalation an AI reviewer can accept), any PR whose
# full change list touches .github/workflows/** or .github/actions/** (either spelling, any case, both sides of a
# rename); a change list it cannot read in full fails closed but stays retryable. enqueuePr is the ONLY code that
# may send the enqueue mutation (a test fails if any other script does), and the drain's wiring of it is card
# xtpxusq. HONEST LIMITS: (1) the drain does not call enqueuePr yet, so today nothing enqueues and this check is not
# required, so this YAML decides no merge; (2) once the strategy is `github-merge-queue`, an entry added by hand
# (the UI, `gh pr merge --auto`, a raw API call) bypasses enqueuePr: only the ruleset's `workflows` pin closes that,
# so do not make `merge-gate` required, or flip the strategy, before the operator applies it. The review
# escalation of a workflow diff (blast radius, pinned by merge-gate-ci.test.mjs) stays as a further layer; card
# xha9nns adds CODEOWNERS / trust-chain human approval.
# BOOTSTRAP (true bootstrap only): until this lands, main has neither scripts/merge-gate-check.mjs nor this
# workflow, so the check reports clear (the same bootstrap review-gate.yml documents); it is not required by the
# ruleset until the operator adds it. The moment main has this workflow, a missing script FAILS CLOSED — a later
# rename or removal of the script can never turn the required check green (pinned by merge-gate-ci.test.mjs).
#
# FAILS CLOSED: an input that is unreadable, or that has no shared source CI can reach yet, holds the PR.
name: Merge gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      prs:
        description: 'PR numbers to evaluate (comma-separated) — dry run'
        required: false
      merge_group_head_sha:
        description: 'Dry-run a merge group: its head commit (with base sha)'
        required: false
      merge_group_base_sha:
        description: 'Dry-run a merge group: its base commit'
        required: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Evaluate the drain's merge gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha || inputs.merge_group_head_sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha || inputs.merge_group_base_sha }}
          MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          DISPATCH_PRS: ${{ inputs.prs }}
        run: |
          if [ ! -f scripts/merge-gate-check.mjs ]; then
            if [ -f .github/workflows/merge-gate.yml ]; then
              echo "::error::scripts/merge-gate-check.mjs is missing from main although .github/workflows/merge-gate.yml is there (renamed or removed?) — failing closed." >&2
              exit 1
            fi
            echo "::warning::neither scripts/merge-gate-check.mjs nor .github/workflows/merge-gate.yml is on main yet — merge gate not bootstrapped; reporting clear."
            exit 0
          fi
          git config user.name merge-gate && git config user.email merge-gate@users.noreply.github.com
          if [ -n "$MG_HEAD_SHA" ]; then
            for sha in "$MG_HEAD_SHA" "$MG_BASE_SHA"; do
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::merge-gate: merge group sha is not a 40-hex commit id — failing closed." >&2; exit 1; }
            done
            git fetch origin -- "$MG_HEAD_SHA" "$MG_BASE_SHA"
            GROUP_TREE="$RUNNER_TEMP/group-tree"
            mkdir -p "$GROUP_TREE"
            git archive "$MG_HEAD_SHA" backlog | tar -x -C "$GROUP_TREE"
            node scripts/merge-gate-check.mjs --repo="$REPO" --merge-group --head-sha="$MG_HEAD_SHA" --base-sha="$MG_BASE_SHA" --head-ref="$MG_HEAD_REF" --group-tree="$GROUP_TREE"
          elif [ -n "$PR_NUMBER" ]; then
            [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::merge-gate: pull_request head sha is not a 40-hex commit id — failing closed." >&2; exit 1; }
            node scripts/merge-gate-check.mjs --repo="$REPO" --pr="$PR_NUMBER" --expect-head="$PR_HEAD_SHA"
          elif [ -n "$DISPATCH_PRS" ]; then
            node scripts/merge-gate-check.mjs --repo="$REPO" --pr="$DISPATCH_PRS"
          else
            echo "::error::merge-gate: no PR or merge group to evaluate (event $EVENT) — failing closed." >&2
            exit 1
          fi
