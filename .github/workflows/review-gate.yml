# #2412 Layer 5 — a required status check that reads RED for as long as the PR carries an un-cleared review
# hold (`review:pending` / `review:changes` / `review:human`, `we:scripts/lib/review-escalation.mjs`'s
# `REVIEW_HOLD_LABELS`). This is an OUTER layer, not a replacement for the drain's own code-side gate
# (`decideReviewGate`): the drain applies its own labels and IS the gate, so this check can't tell "an
# independent validator accepted this" from "someone applied the label" — it exists to close the one hole the
# code-side gate can't see, a MANUAL `gh pr merge` (or a click on GitHub's merge button) that bypasses the
# drain entirely.
#
# WHY `labeled`/`unlabeled` ARE IN THE TRIGGER LIST, not just the default open/synchronize/reopened set: the
# check's verdict must track the PR's label state even when no new commit lands — a park (label added) must
# turn this check red WITHOUT a push, and a clearance (label removed) must turn it green again the same way.
#
# WHY THE EVENT PAYLOAD'S OWN LABEL LIST, not a fresh `gh pr view`: `github.event.pull_request.labels` already
# carries the post-event label set for every trigger type used here (GitHub resolves it before dispatching the
# event), so no extra API call — and no `pull-requests: read` permission — is needed. `contents: read` is
# enough to check out the repo for the script.
#
# THE SCRIPT COMES FROM MAIN, NEVER FROM THE PR'S OWN REF — same rule, same reason, as
# `apply-review-request.yml`'s own note on this: a `pull_request` trigger's default checkout resolves the PR's
# merge ref, and this job's whole job is to hold a PR whose diff it has not vetted. Checking out the PR's own
# `check-review-gate.mjs` (or the `REVIEW_HOLD_LABELS` it imports from `review-escalation.mjs`) would let a PR
# neuter its own gate from within its own diff — e.g. emptying `REVIEW_HOLD_LABELS` so `reviewGateVerdict`
# always reports clear. `ref: main` pins the CODE to a trusted tree; the LABELS still come from the untrusted
# event payload, which is fine — they are read as DATA (`--labels-json=...`), never executed.
#
# BECOMING A REAL GATE IS A REPO-ADMIN ACTION, NOT A CODE CHANGE (same as `smoke` in ci.yml, see its own note
# on the same point): this job's check name (`review-gate`) must be added to the branch-protection required
# list before it can actually block a merge. Until then it runs and reports, same as any other check.
#
# BOOTSTRAP: `ref: main` above means this VERY PR — the one that first adds `scripts/check-review-gate.mjs`
# and this workflow — sees neither file on `main` yet (they don't land until this PR merges). The same is
# true of any other PR still open at that exact moment. Failing hard on the missing module would make this
# check permanently red for the PR that introduces it, with no way to ever turn green — caught live as PR
# #1911's own `review-gate` failing 6 times with `Cannot find module '.../scripts/check-review-gate.mjs'`.
# The step below checks for the script's existence AFTER checking out `main` and reports clear (exit 0,
# not held) when it is missing, rather than crashing. This does not reopen the hole `ref: main` closes:
# the check still never reads the SCRIPT from the PR's own ref, only tests for the file's absence on the
# trusted tree — a PR cannot fake presence-on-main from within its own diff. Once this PR lands, the file
# exists on `main` permanently (removing it would be its own reviewed diff), so this branch becomes dead
# code from then on — a permanent defensive no-op, not a standing loophole.
#
# QUEUE RELIEF (actions-queue-relief, 2026-10-03): this workflow fired on EVERY label change on every PR and
# queued 75 runs at once, each with a full checkout + `npm ci`. Two changes, neither touching the verdict:
#   1. `concurrency` per PR with `cancel-in-progress` — a run only ever reports the PR's label state at its own
#      event time, so only the LATEST run per PR matters; an older queued/running one is cancelled. The surviving
#      run is the newest, so the check's latest row per head SHA is always a real verdict.
#   2. A cheap fast path for a `labeled`/`unlabeled` event whose label does NOT start with `review:`. Such an event
#      cannot change the verdict, but it still produces the NEWEST run, and the drain (`review-ci-gate.mjs`) reads
#      the latest row per name and treats a `skipped` conclusion as NOT success. So the job is NOT skipped with a
#      job-level `if:`: it still runs and still reports the true verdict, computed in shell from the event's own
#      label list (no checkout, no `npm ci`). The shell hold list below is asserted equal to REVIEW_HOLD_LABELS
#      by `scripts/__tests__/ci-card-only.test.mjs`. Every other event takes the original path unchanged.
name: Review gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    runs-on: ubuntu-latest
    steps:
      # Fast path: an unrelated label (not `review:*`) changed. The verdict is still computed and reported,
      # just without a checkout. Must stay in sync with REVIEW_HOLD_LABELS (asserted by a test).
      - name: Fast verdict for a non-review label event
        id: fast
        if: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !startsWith(github.event.label.name, 'review:') }}
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          HOLD_LABELS_LIST='review:pending,review:changes,review:human'
          echo "done=true" >> "$GITHUB_OUTPUT"
          held="$(printf '%s' "$LABELS_JSON" | jq -r --arg l "$HOLD_LABELS_LIST" '[.[].name] | map(select(. as $n | ($l | split(",")) | index($n))) | join(", ")')"
          if [ -n "$held" ]; then
            echo "check-review-gate held - a review hold stands: $held"
            exit 1
          fi
          echo "check-review-gate ok - no review hold present"

      - uses: actions/checkout@v4
        if: ${{ steps.fast.outputs.done != 'true' }}
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: ${{ steps.fast.outputs.done != 'true' }}
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
        if: ${{ steps.fast.outputs.done != 'true' }}

      - name: Check for an un-cleared review hold
        if: ${{ steps.fast.outputs.done != 'true' }}
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          if [ ! -f scripts/check-review-gate.mjs ]; then
            echo "scripts/check-review-gate.mjs not present on main yet — review gate not bootstrapped; reporting clear (see the BOOTSTRAP note above)."
            exit 0
          fi
          node scripts/check-review-gate.mjs --labels-json="$LABELS_JSON"
