# Shadow mode: no consumer in S1. Mode is off|shadow only.
# A verdict is a hint and never causes a merge.
name: drain-verdict
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to classify
        required: true
        type: number
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: drain-verdict
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Classify requested PR
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_PR: ${{ inputs.pr }}
        run: |
          mkdir -p verdicts
          node scripts/drain-classify-only.mjs "--only=$REQUESTED_PR" "--verdict-out=verdicts/dispatch.json"
      - name: Classify recently updated PRs
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          mkdir -p verdicts
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --search 'sort:updated-desc' --limit 10 --json number --jq '.[].number' > "$RUNNER_TEMP/drain-verdict-prs"
          while IFS= read -r pr; do
            if ! node scripts/drain-classify-only.mjs "--only=$pr" "--verdict-out=verdicts/pr-$pr.json"; then
              echo '::warning::Classification failed; use the local drain for this PR.'
            fi
          done < "$RUNNER_TEMP/drain-verdict-prs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: drain-verdicts
          path: verdicts/*.json
          retention-days: 1
          if-no-files-found: warn
