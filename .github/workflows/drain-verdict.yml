# Shadow mode: no consumer in S1. Mode is off|shadow only.
# A verdict is a hint and never causes a merge.
name: drain-verdict
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to classify
        required: true
        type: number
  schedule:
    - cron: '*/10 * * * *'
# checks/statuses: the dry-run reads the required check (statusCheckRollup + REST check-runs);
# without them every PR reads "required check missing" and no verdict can say enqueue.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
concurrency:
  group: drain-verdict
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Classify
        env:
          REQUESTED_PR: ${{ inputs.pr }}
        run: node scripts/drain-classify-only.mjs --batch --verdict-dir=verdicts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: drain-verdicts
          path: verdicts/*.json
          retention-days: 1
          if-no-files-found: ignore
