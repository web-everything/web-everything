# Enforces: every PR that fixes a live daemon break adds a soak break scenario
# (scripts/conveyor/soak/breaks/*.mjs + its *.soak.test.mjs, registered in that directory's index.mjs the way
# existing ones are — e.g. daemon-overlay-lock-wait, rebuild-finalize-starved), or carries an explicit
# `soak-waiver: <reason>` line in its PR body. Operator-approved (#4075): today only 2 of ~12 daemon fixes
# added one; the standing prose rule (`we:skills-src/conveyor/SKILL.md#daemon-soak-harness`,
# `we:skills-src/conveyor/fix-agent-brief.md`) evidently was not enough on its own.
#
# THE DECISION LOGIC lives in `we:scripts/lib/soak-replay-gate.mjs` (pure, unit-tested — see its own header
# comment and `we:scripts/lib/__tests__/soak-replay-gate.test.mjs` for the full rationale, including frozen
# real-PR proof), reached here through `we:scripts/soak-replay-gate-cli.mjs`. This workflow is a thin transport:
# it retains the event title but fetches the live PR body with `pull-requests: read` on every execution,
# including reruns, so adding or removing a waiver takes effect without a new commit. Retrieval fails closed.
# It hands
# the CLI the base/head shas directly (`--base-sha`/`--head-sha`) so IT computes the changed-file list from
# their MERGE-BASE (`we:scripts/lib/soak-gate-merge-base-diff.mjs`) — never a plain two-endpoint `base..head`
# diff, which misattributes anything `main` changed since the PR's branch diverged to the PR itself (backlog
# #4264 — live misfire on PR #2822, a backlog-only PR that went red on this exact gap).
#
# A SEPARATE TOP-LEVEL WORKFLOW, deliberately NOT a step inside `.github/workflows/ci.yml`'s `daemon-soak` job:
# PR #2770 was open and restructuring that exact job (into `daemon-soak-scope` / `soak-shard` / `daemon-soak`)
# when this workflow was added, so touching ci.yml here would have conflicted with that in-flight change for no
# reason — this check is fully independent of whether the soak itself ran, and mirrors `review-gate.yml`'s own
# shape (a same-named sibling required check, not a nested step).
#
# BOOTSTRAP + THE SAME "run scripts FROM main, never the PR's own ref" RULE `review-gate.yml` documents at
# length (see that file's own header for the full reasoning): `ref: main` so a PR cannot neuter this gate by
# editing `soak-replay-gate.mjs`/`soak-replay-gate-cli.mjs` within its own diff, and the script-presence check
# below so THIS VERY PR (which adds those files to main for the first time) does not fail on a module that does
# not exist on main yet.
#
# BECOMING A REQUIRED CHECK IS A REPO-ADMIN ACTION, NOT A CODE CHANGE (same note as `review-gate` and `smoke` in
# ci.yml): this job runs and reports on every PR already; adding `soak-replay-gate` to branch protection's
# required list is separate.
name: Soak replay gate

on:
  pull_request:
    branches: [main, 'lane/**']  # lane/**: a GitHub-stacked PR runs its own required checks while its base is open (stack.reviewWhileBaseOpen)
    types: [opened, synchronize, reopened, edited]
  # GitHub merge queue (merge-delivery strategy `github-merge-queue`): the required `soak-replay-gate` check must
  # also report on each merge-group commit. There it evaluates EVERY PR in the group (listed by
  # scripts/merge-gate-check.mjs --list-group) with that PR's own live body and base/head — the same verdict the
  # pull_request run gives, re-read right before the merge. No PR identifiable ⇒ fail closed.
  merge_group:

permissions:
  contents: read
  pull-requests: read

# Queue relief: the verdict reads the live PR body and head, so only the latest run per PR matters.
concurrency:
  group: soak-replay-gate-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  soak-replay-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Does this PR fix a live daemon break without a soak replay or a waiver?
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f scripts/soak-replay-gate-cli.mjs ]; then
            echo "scripts/soak-replay-gate-cli.mjs not present on main yet — soak-replay gate not bootstrapped; reporting clear."
            exit 0
          fi
          if ! PR_BODY=$(gh api "repos/$PR_REPO/pulls/$PR_NUMBER" --jq '.body // ""'); then
            echo "::error::Failed to retrieve live PR body for $PR_REPO#$PR_NUMBER; soak-replay gate cannot evaluate." >&2
            exit 1
          fi
          # Fetch the PR's own head sha's FULL ancestry (no --depth) — the checkout above already unshallowed
          # `main` completely (fetch-depth: 0), so this only pulls the commits unique to the PR branch itself,
          # and a `git merge-base` can then find the true fork point rather than the two endpoints directly
          # (backlog/4264 — a shallow `--depth=1` head fetch left no shared history for `merge-base` to walk
          # back to, which is exactly why the old two-endpoint diff was the only thing that could run before).
          git fetch origin "$HEAD_SHA"
          # BOOTSTRAP for the `--base-sha`/`--head-sha` mode itself: the CLI above is main's copy, so until the PR
          # that adds that mode has landed, main's CLI does not know it (exit 3, usage error). Fall back to
          # computing the same merge-base diff inline and handing it over as `--files-status`, which every CLI
          # version accepts.
          if grep -q -- 'base-sha' scripts/soak-replay-gate-cli.mjs; then
            node scripts/soak-replay-gate-cli.mjs --title="$PR_TITLE" --body="$PR_BODY" --base-sha="$BASE_SHA" --head-sha="$HEAD_SHA"
          else
            MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA" || echo "$BASE_SHA")
            FILES_STATUS=$(git diff --name-status -M "$MERGE_BASE" "$HEAD_SHA")
            node scripts/soak-replay-gate-cli.mjs --title="$PR_TITLE" --body="$PR_BODY" --files-status="$FILES_STATUS"
          fi

      - name: Merge group — every PR in it, each with its own live body and base/head
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          if [ ! -f scripts/soak-replay-gate-cli.mjs ] || [ ! -f scripts/merge-gate-check.mjs ]; then
            echo "::error::soak-replay gate: merge-group support not on main yet — failing closed." >&2
            exit 1
          fi
          git fetch origin "$MG_HEAD_SHA" "$MG_BASE_SHA"
          PRS=$(node scripts/merge-gate-check.mjs --repo="$PR_REPO" --merge-group --list-group --head-sha="$MG_HEAD_SHA" --base-sha="$MG_BASE_SHA" --head-ref="$MG_HEAD_REF") || { echo "::error::could not list the merge group's PRs — failing closed." >&2; exit 1; }
          [ -n "$PRS" ] || { echo "::error::empty merge group — failing closed." >&2; exit 1; }
          rc=0
          for N in $PRS; do
            echo "── PR #$N"
            if ! PR_JSON=$(gh api "repos/$PR_REPO/pulls/$N"); then echo "::error::cannot read PR #$N" >&2; rc=1; continue; fi
            TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title // ""')
            BODY=$(printf '%s' "$PR_JSON" | jq -r '.body // ""')
            BASE=$(printf '%s' "$PR_JSON" | jq -r '.base.sha')
            HEAD=$(printf '%s' "$PR_JSON" | jq -r '.head.sha')
            git fetch origin "$HEAD" "$BASE"
            node scripts/soak-replay-gate-cli.mjs --title="$TITLE" --body="$BODY" --base-sha="$BASE" --head-sha="$HEAD" || rc=1
          done
          exit $rc
