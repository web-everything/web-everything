name: CI

# Runs the unit suite + repo health gate on every push to main and on every pull_request against main
# (#2080, #2151). Closes the no-CI gap: the 2000+ vitest tests and check:standards previously ran only
# when an agent remembered to run them locally — origin now verifies every push (push-if-green publishes
# main, this re-checks it on GitHub). The pull_request trigger makes the same gate a PR status check so
# main can require it before merge (the #2138 merge-queue / self-approved-PR direction); it does not
# block today's direct-push landing.
#
# Scope: the fast deterministic lanes + the visual-regression guard (#2177), split across parallel jobs
# so the correctness lane doesn't wait on the slower build/browser steps:
#   job `test-shard` — the 2000+ vitest suite split across N runners (`vitest run --shard=i/N`, #2682),
#                 each emitting a partial coverage report. A matrix job, so its own check names are
#                 `test-shard (1..N)`, NOT a required check.
#   job `test`  — THE required aggregating check: fans in every shard's coverage, applies the 80% bar
#                 (#2082) to the COMBINED result, and runs the repo health gate (check:standards,
#                 unsharded). Sharding the suite cut this lane's wall-clock without weakening the bar —
#                 every test still runs, just split across runners (#2682).
#   job `smoke` — deploy smoke (build:docs, #2220) + the deterministic Playwright interaction lane (#2070,
#                 self-contained against a static fixture server, no app build). Runs concurrently with
#                 `test`; both moved OFF `test`'s critical path here, so branch protection must require
#                 BOTH `test` and `smoke` (see the note on the `smoke` job below).
#   job `visual` — visual regression against committed linux baselines (currently disabled, see below).
# The live-server a11y/content/smoke lanes still need a build-then-serve step — those CI-home under #800.
#
# Visual lane (job: visual): builds the docs site (requires FUI sibling, same as deploy.yml), serves the
# built _site statically on :8080, and runs `check:visual` against committed -chromium-linux baselines —
# the SOLE baseline set (#2235; a prior darwin set was dropped once rendering was pinned to the container,
# #2234, making linux-in-container the one reproducible target) in
# tests/visual/rendered-site-visual.spec.ts-snapshots/. Refresh them by running the `update-visual-baselines`
# workflow (.github/workflows/update-visual-baselines.yml) — a local, non-containerized `check:visual:update`
# run on a non-linux host would still produce mismatched filenames, so refreshing stays a container-only
# operation (CI job above or the update-visual-baselines workflow), never a local darwin update.
# The `visual` job renders inside a version-locked `mcr.microsoft.com/playwright:vX.Y.Z-jammy` container
# pinned to the `@playwright/test` version installed in package-lock.json (#2234) — rendering on a bare
# `ubuntu-latest` runner lets the font/AA stack drift with the image, which is exactly what the -linux
# baselines are supposed to make reproducible. `npm run check:standards` fails loud if the image tag and
# the installed Playwright version ever drift apart (scripts/check-standards-rules.mjs, PLAYWRIGHT_CONTAINER
# _PIN_REQUIRED_FILES). Bump procedure: bump `@playwright/test` in package.json → `npm install` → copy the
# new resolved version from package-lock.json into the `container: image:` tag here AND in
# update-visual-baselines.yml (`vX.Y.Z-jammy`) → `npm run check:standards` to confirm lockstep.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # #5000: never cancel a run on main. A merge every few minutes cancelled 85 of 100 main runs (2026-10-03),
  # hiding main's red/green for hours. PR branches still cancel superseded runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # CARD-ONLY LIGHT PATH (actions-queue-relief, 2026-10-03). A PR that changes only `backlog/**` runs the
  # `test` job's `check:standards` (the backlog/card guards) but NOT the unit shards, coverage merge,
  # integration suite, docs build or Playwright lane. Detection is `scripts/ci-card-only.mjs` (tested):
  # light ONLY for a `pull_request` whose every changed path is under `backlog/`; a push to main, a manual
  # dispatch, an empty diff, or any other path is the full suite. Fail closed: if this job fails, `light` is
  # empty (not 'true'), and `test` / `smoke` below fail on `needs.changes.result != 'success'`.
  #
  # REQUIRED CHECKS STILL REPORT FROM REAL RUNNING JOBS: `test` and `smoke` keep running as jobs (they do
  # the light work or a one-line pass) instead of being job-level skipped, because a SKIPPED required check
  # reads `skipped`, which the drain's `reviewCiGate` (scripts/lib/review-ci-gate.mjs) does NOT treat as
  # success. `daemon-soak` already finishes in seconds when no daemon code is touched (a card-only PR never is).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      light: ${{ steps.detect.outputs.light }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is this a card-only PR?
        id: detect
        run: node scripts/ci-card-only.mjs --event='${{ github.event_name }}' --base='${{ github.event.pull_request.base.sha }}' --head=HEAD >> "$GITHUB_OUTPUT"

  # Sharded unit suite (#2682). The 2000+ vitest suite runs split across N parallel runners
  # (`vitest run --shard=i/N`) to cut the `test` gate's wall-clock. Each shard runs WITH coverage but
  # with its per-shard thresholds disabled (`test:coverage:shard`) — a single shard exercises only
  # ~1/N of the tests, so no shard could meet the 80% bar alone — and uploads its partial
  # coverage-final.json. The `test` job below fans them back in and applies the bar to the COMBINED
  # result, so the split changes only WHERE tests run, never WHETHER coverage gates. Sharding is by test
  # FILE, so every file (incl. the poolMatchGlobs singleFork one) lands in exactly one shard.
  test-shard:
    needs: changes
    if: ${{ needs.changes.outputs.light != 'true' }}
    # #5027 — Arm-runner experiment switch. The repo is public, so `ubuntu-24.04-arm` is free; paid larger
    # runners were rejected on cost. `vars.WE_SHARD_RUNNER` unset (the default) = x86 `ubuntu-latest`; set it to
    # `ubuntu-24.04-arm` to trial the shards on Arm, unset it to abort — no PR needed either way. ONLY this job
    # reads the variable; `test` and every other job stay on `ubuntu-latest`. Compare with
    # `node scripts/ci/shard-runner-compare.mjs`.
    runs-on: ${{ vars.WE_SHARD_RUNNER || 'ubuntu-latest' }}
    # xd1sfms (#4075/#3383) — LIVE 2026-09-25: PR #2636's `test-shard (1)` (run 36161558017) hung
    # `in_progress` 3h+ while its 3 sibling shards finished in ~90-260s; with no `timeout-minutes` set,
    # GitHub's 360-min job default applied, so a single hung shard blocked the PR for 6 hours. Sized at
    # ~3x the measured p95: 15 successful runs sampled 2026-09-25 gave min=87s max=258s p50=138s
    # p95=249s per shard — 3x249s≈12.5min, rounded up for headroom. A GENUINE slow run stays well inside
    # this; a HUNG one now gets killed by GitHub itself within the hour instead of waiting 6h, and the
    # new `scripts/conveyor/ci-red-recovery-watch.mjs` hung-run sweep (see its own header) no longer has
    # to out-wait this job to reclaim the PR.
    timeout-minutes: 15
    strategy:
      # Don't cancel sibling shards when one fails — the `test` aggregator reports the combined red, and
      # cancelling would hide which other shards also failed.
      fail-fast: false
      matrix:
        # N shards. Keep this list's LENGTH in lockstep with the `--expect=N` in the `test` job below
        # (the shard divisor itself is derived from the matrix via `strategy.job-total`, so only the
        # --expect guard is hand-synced). More shards = more fixed per-runner setup (~25s each) for less
        # marginal wall-clock; 4 balances parallelism against that setup tax.
        # NOTE: `strategy.job-total` (used as the shard divisor below) counts ALL matrix combinations, so
        # this matrix must stay SINGLE-DIMENSION — adding a second axis would break the `i/N` divisor.
        shard: [1, 2, 3, 4]
    steps:
      # Sibling layout under $GITHUB_WORKSPACE so WE's `../frontierui` resolves — both the vitest/vite
      # `@frontierui/*` alias (dev/test-time; `we:vitest.config.ts` → `../frontierui/plugs`) AND the pinned
      # component-render CLI the gate/build call. #2165 (single-repo CI has neither the sibling nor a
      # published `@frontierui/*` package), mirroring the #1137 deploy.yml workaround:
      #   $GITHUB_WORKSPACE/web-everything  (this repo)
      #   $GITHUB_WORKSPACE/frontierui      (the sibling)
      - name: Checkout WE
        uses: actions/checkout@v4
        with:
          path: web-everything
          fetch-depth: 0 # tests that shell check-standards need origin/main history for the backlog scope guards
      - name: Mint FUI read token (GitHub App)
        id: fui-app-token
        if: vars.WE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WE_APP_ID }}
          private-key: ${{ secrets.WE_APP_PRIVATE_KEY }}
          owner: frontier-ui
          repositories: frontierui
          permission-contents: read
      - name: Checkout FUI (sibling)
        uses: actions/checkout@v4
        with:
          repository: frontier-ui/frontierui
          token: ${{ steps.fui-app-token.outputs.token || secrets.FUI_READ_TOKEN }}
          path: frontierui

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-everything/package-lock.json
            frontierui/package-lock.json

      # FUI first (ratified #1946/#2016 ordering): install its deps (the `@frontierui/*` alias resolves to
      # sibling source that imports them) + build the pinned component-render CLI the gate/build call.
      - name: Install + build FUI tools
        working-directory: frontierui
        run: |
          npm ci
          npm run build:tools

      - name: Install
        working-directory: web-everything
        run: npm ci

      # `strategy.job-total` = the matrix length, so the divisor stays correct if the shard list changes.
      - name: Unit suite shard ${{ matrix.shard }}/${{ strategy.job-total }} (coverage, no per-shard bar)
        working-directory: web-everything
        # Card 11: files are assigned to this shard by MEASURED time (scripts/ci/shard-assign.mjs +
        # scripts/ci/test-timings.json), not vitest's blind `--shard=i/N`. Every file is in exactly one shard.
        run: |
          mapfile -t files < <(node scripts/ci/shard-assign.mjs --suite=unit --shard=${{ matrix.shard }}/${{ strategy.job-total }})
          echo "unit shard ${{ matrix.shard }}/${{ strategy.job-total }}: ${#files[@]} files"
          npm run test:coverage:shard -- --reporter=default --reporter=json --outputFile.json=coverage/timing-unit-${{ matrix.shard }}.json "${files[@]}"

      # Upload this shard's partial coverage for the `test` job to merge. `if-no-files-found: error`
      # turns a missing report into a red shard (not a silent under-count) — the merge's --expect guard
      # is the second line of defence.
      - name: Upload shard coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: web-everything/coverage/coverage-final.json
          if-no-files-found: error

      # Per-file durations for refreshing scripts/ci/test-timings.json (`node scripts/ci/shard-assign.mjs
      # --suite=unit --update=<these>`). Evidence only; never gates.
      - name: Upload shard timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: timing-unit-${{ matrix.shard }}
          path: web-everything/coverage/timing-unit-${{ matrix.shard }}.json
          if-no-files-found: ignore

  # Aggregating gate (#2682) — THE required `test` status check. Branch protection still requires `test`
  # (this job) + `smoke`, so the required-check contract is UNCHANGED by the shard split. It fans in every
  # shard's coverage, applies the #2082 80% bar to the COMBINED result, and runs the repo health gate
  # (check:standards — unsharded and fast, it doesn't touch the test partition).
  #
  # Runs even when a shard failed (`if: !cancelled()`), and its first step fails the job unless EVERY
  # shard succeeded: a required check that is SKIPPED (the default when a `needs` dep fails) can be
  # mis-read by branch protection as satisfied, which would let a broken shard merge green. Failing
  # explicitly makes `test` a real red instead.
  test:
    needs: [changes, test-shard, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # xd1sfms (#4075/#3383) — same measurement pass as `test-shard` above: 15 successful runs sampled
    # 2026-09-25 gave this job (merge coverage + check:standards; the integration suite moved to its own job)
    # min=243s max=380s p50=343s p95=380s — 3x380s≈19min, rounded up.
    timeout-minutes: 20
    steps:
      - name: Gate on shard results
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes (card-only detection) did not succeed (result: ${{ needs.changes.result }}) - failing closed."
            exit 1
          fi
          if [ "${{ needs.changes.outputs.light }}" = "true" ]; then
            echo "Card-only PR: unit shards intentionally not run; running check:standards only."
            exit 0
          fi
          if [ "${{ needs.test-shard.result }}" != "success" ]; then
            echo "One or more test shards did not succeed (test-shard result: ${{ needs.test-shard.result }})."
            exit 1
          fi
          # The real-git integration suite is its own parallel job now; `test` still goes red when it does, so the
          # required `test` check means exactly what it did when the suite ran inside this job.
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "The integration job did not succeed (result: ${{ needs.integration.result }})."
            exit 1
          fi

      # Same sibling layout as the shards — check:standards shells out to FUI's render CLI.
      - name: Checkout WE
        uses: actions/checkout@v4
        with:
          path: web-everything
          fetch-depth: 0 # backlog scope guards compare the PR against origin/main
      - name: Mint FUI read token (GitHub App)
        id: fui-app-token
        if: vars.WE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WE_APP_ID }}
          private-key: ${{ secrets.WE_APP_PRIVATE_KEY }}
          owner: frontier-ui
          repositories: frontierui
          permission-contents: read
      - name: Checkout FUI (sibling)
        uses: actions/checkout@v4
        with:
          repository: frontier-ui/frontierui
          token: ${{ steps.fui-app-token.outputs.token || secrets.FUI_READ_TOKEN }}
          path: frontierui

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-everything/package-lock.json
            frontierui/package-lock.json

      - name: Install + build FUI tools
        working-directory: frontierui
        run: |
          npm ci
          npm run build:tools

      - name: Install
        working-directory: web-everything
        run: npm ci

      # Each shard artifact lands in its own subdir (no merge-multiple), so coverage-final.json names
      # don't collide; the merge script walks the tree recursively.
      - name: Download shard coverage
        if: ${{ needs.changes.outputs.light != 'true' }}
        uses: actions/download-artifact@v4
        with:
          path: web-everything/coverage-shards
          pattern: coverage-shard-*

      # Merge the partial shard reports and enforce the 80% bar on the combined coverage (#2082).
      # --expect=N must equal the matrix shard count above — it fails loud if a shard's report is
      # missing, so a dropped shard can never under-count coverage into a false green.
      - name: Merge coverage + enforce 80% bar (#2082)
        if: ${{ needs.changes.outputs.light != 'true' }}
        working-directory: web-everything
        run: npm run coverage:merge -- coverage-shards --threshold=80 --expect=4

      - name: Repo health gate
        working-directory: web-everything
        run: npm run check:standards

  # Real-git integration suite as its OWN job, parallel with the shards (card 6, perf sweep 2026-10-07). It used
  # to be the last step of `test`, which `needs: test-shard`, so its 5.8-8.4 min started only after every shard
  # finished. It never used the shards' output (only the coverage merge does), so it now needs just `changes` and
  # runs beside them: the critical path drops from shards + (merge + standards + integration) to
  # max(shards + merge + standards, integration).
  #
  # The real-git/real-subprocess tier `vitest.config.ts` excludes (see its `test.exclude` comment) is split out
  # so `npm run test:unit` (and everything that shells it locally) no longer pays real git/subprocess cost per lane.
  #
  # Check names: `integration` is its own check and is meant to be REQUIRED in branch protection alongside `test`,
  # `smoke` and `daemon-soak`. `test` ALSO still fails when this job fails (see its "Gate on shard results" step),
  # so nothing that is required today became skippable.
  #
  # Card-only PRs: like `test`/`smoke`, it stays a REAL running job (not job-level skipped) that passes in
  # seconds, because a SKIPPED required check is not read as success by the drain's `reviewCiGate`. Fail closed:
  # if `changes` did not succeed, the first step fails the job.
  integration:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Measured 5.8-8.4 min (perf sweep 2026-10-07); ~2.5x the worst case.
    timeout-minutes: 20
    steps:
      - name: Gate on changes
        id: gate
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes (card-only detection) did not succeed (result: ${{ needs.changes.result }}) - failing closed."
            exit 1
          fi
          if [ "${{ needs.changes.outputs.light }}" = "true" ]; then
            echo "Card-only PR: integration suite intentionally not run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Same sibling layout as the shards.
      - name: Checkout WE
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/checkout@v4
        with:
          path: web-everything
          fetch-depth: 0
      - name: Mint FUI read token (GitHub App)
        id: fui-app-token
        if: vars.WE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WE_APP_ID }}
          private-key: ${{ secrets.WE_APP_PRIVATE_KEY }}
          owner: frontier-ui
          repositories: frontierui
          permission-contents: read
      - name: Checkout FUI (sibling)
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: frontier-ui/frontierui
          token: ${{ steps.fui-app-token.outputs.token || secrets.FUI_READ_TOKEN }}
          path: frontierui

      - uses: actions/setup-node@v4
        if: ${{ steps.gate.outputs.run == 'true' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-everything/package-lock.json
            frontierui/package-lock.json

      - name: Install + build FUI tools
        if: ${{ steps.gate.outputs.run == 'true' }}
        working-directory: frontierui
        run: |
          npm ci
          npm run build:tools

      - name: Install
        if: ${{ steps.gate.outputs.run == 'true' }}
        working-directory: web-everything
        run: npm ci

      - name: Real-git integration suite (lane-pool, operations transport)
        if: ${{ steps.gate.outputs.run == 'true' }}
        working-directory: web-everything
        run: npm run test:integration:vitest

  # #4075 DAEMON SOAK HARNESS (card x0zg44l) — `npm run test:soak`: the REAL review + fix daemons, the real
  # rebuild/self-sync + live smoke gate, a real bare remote with main moving, fake GitHub + fake sessions, the
  # invariants (clone clean, <=1 main move behind, tick bounded, no onTick crash, owed work dispatched) checked
  # after EVERY tick — plus one regression scenario per live daemon break (scripts/conveyor/soak/breaks/). Minutes,
  # not seconds, so on a PR it runs ONLY when the PR touches daemon code (the path check below; a PR outside it
  # passes this job in seconds), and ALWAYS on a push to main and on a manual dispatch. WHY on main (soak-main-red,
  # 2026-09-26): it used to run on PRs only, so a soak regression that landed on main (the lane-pool verdict memo
  # that pinned a freed lane as "holds work", surfaced by the soak sharding) was invisible there — no red main,
  # no main-red window — and instead read as a red `daemon-soak` on EVERY unrelated daemon PR, each of which then
  # looked like its own failure. Running on main makes that regression a red `main` the moment it lands, so
  # `scripts/conveyor/main-red-recovery.mjs` opens a red window and `reconcile-core`'s `owed-ci-rerun` /
  # `ci-red-recovery-watch.mjs` treat those PRs' `daemon-soak` reds as main's, not theirs. WE-only: no FUI
  # sibling needed. `daemon-soak` (the aggregator job
  # below) IS a required branch-protection check today — `gh api repos/.../branches/main/protection --jq
  # .required_status_checks.contexts` → `["test","smoke","daemon-soak"]` — and the drain's own required-context
  # reads (`scripts/conveyor/ci-red-recovery-watch.mjs`, `scripts/conveyor/main-red-recovery.mjs`) read that same
  # live list, never a hardcoded one, so the exact name `daemon-soak` must keep resolving across this split.
  #
  # SHARDED (mirrors the unit suite's test-shard/test split above) because this used to be ONE job running the
  # 50-tick baseline PLUS all 18 break scenarios serially: 10-12min when daemon code changed — the slowest job in
  # CI (`test` runs 4-6min) — and growing by one scenario every time a new live daemon break gets a regression
  # test. Now three jobs:
  #   job `daemon-soak-scope` — the path-touch check, run ONCE (not per-shard) so the ~10s no-daemon-code skip
  #                 stays exactly as cheap as it was in the single-job version.
  #   job `soak-shard`  — a 4-way matrix (`scripts/conveyor/soak/shard-files.mjs`): shard 1 is ALWAYS the 50-tick
  #                 baseline alone (it dwarfs any one break scenario, so a blind file-count split would strand it
  #                 next to a handful of breaks in one shard while the rest sit idle); shards 2-4 round-robin the
  #                 `breaks/*.soak.test.mjs` files by filename, discovered from disk — a new break scenario (one
  #                 new file) lands in a shard automatically, no shard-list to hand-maintain, so wall time stays
  #                 flat as scenarios grow instead of creeping back up. A matrix job, so its own check names are
  #                 `soak-shard (1..4)`, NOT required (mirrors `test-shard`'s non-required matrix checks).
  #   job `daemon-soak` — THE required aggregating check, name UNCHANGED: skips in ~10s when `daemon-soak-scope`
  #                 found no daemon code touched (identical observable behavior to before the split), red if the
  #                 scope job itself failed (fail closed), otherwise red unless EVERY shard succeeded. Full coverage is preserved — sharding only changes WHERE
  #                 each scenario runs, never WHETHER it runs; every scenario still runs on every daemon PR.
  daemon-soak-scope:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this PR touch daemon code?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD)"
          hits="$(printf '%s\n' "$changed" | grep -E '^(skills-src/conveyor/|scripts/conveyor/|scripts/lib/daemon-|scripts/lib/gh-app-shim|scripts/lib/main-staleness|scripts/lane-pool|scripts/review-set-label\.mjs$|scripts/operations/[^/]*dispatch[^/]*$|vitest\.soak\.config\.ts$)' || true)"
          if [ -n "$hits" ]; then
            echo "Daemon code touched — running the soak:"; printf '  %s\n' $hits
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No daemon code touched — soak not needed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # One shard of the soak: shard 1 is the 50-tick baseline alone, shards 2-4 each get a slice of the break
  # scenarios (`scripts/conveyor/soak/shard-files.mjs`'s round-robin — see that module's own header for why a
  # blind vitest `--shard` split doesn't work here). `fail-fast: false` mirrors `test-shard`: one shard's break
  # failing must not hide a sibling shard's own result.
  soak-shard:
    needs: daemon-soak-scope
    if: needs.daemon-soak-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    # No measured per-shard p95 yet (this split is new) — sized generously pending a first-run sample, same
    # ~3x-p95 method `test-shard` used once IT had data (see that job's own timeout comment above).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Soak shard ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test:soak:shard -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # THE required `daemon-soak` check (name unchanged from before the split — see the header above for why that
  # matters). Skips green in ~10s when `daemon-soak-scope` SUCCEEDED and found no daemon code touched, same as the
  # single-job version; red if the scope job itself failed (fail closed — test: soak/__tests__/daemon-soak-gate);
  # otherwise red unless every `soak-shard` matrix entry succeeded — a `soak-shard` that got SKIPPED
  # (its `needs` dep failing, or the matrix simply not running) is not `success`, so a broken shard can never
  # silently read as satisfied, same guard the `test` aggregator above uses for `test-shard`.
  daemon-soak:
    needs: [daemon-soak-scope, soak-shard]
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on shard results
        run: |
          # Fail CLOSED on the scope job itself: a crashed `daemon-soak-scope` leaves `outputs.run` empty, and an
          # empty value must never read as "no daemon code touched" (that would green the required check with the
          # soak never run). Only an explicit `run=false` from a SUCCESSFUL scope job skips the soak.
          if [ "${{ needs.daemon-soak-scope.result }}" != "success" ]; then
            echo "daemon-soak-scope did not succeed (result: ${{ needs.daemon-soak-scope.result }}) — cannot tell whether daemon code was touched."
            exit 1
          fi
          case "${{ needs.daemon-soak-scope.outputs.run }}" in
            false) echo "No daemon code touched — soak not needed."; exit 0 ;;
            true) ;;
            *) echo "daemon-soak-scope emitted no usable run output (got: '${{ needs.daemon-soak-scope.outputs.run }}')."; exit 1 ;;
          esac
          if [ "${{ needs.soak-shard.result }}" != "success" ]; then
            echo "One or more soak shards did not succeed (soak-shard result: ${{ needs.soak-shard.result }})."
            exit 1
          fi
          echo "All soak shards succeeded."

  # Deploy-smoke + deterministic interaction lane. Split OUT of `test` so the fast correctness
  # lane (coverage + gate) no longer waits on the ~25s docs build and the ~54s Playwright install +
  # interaction run — the two now run on parallel runners, cutting CI wall-clock from ~3m to ~1m50s.
  #
  # REQUIRED-CHECK NOTE: `test` used to be the SOLE required status check, so keeping the #2220 deploy
  # smoke (`build:docs`) and the #2070 interaction lane inside it was what made them gate merges. Now that
  # both moved here, branch protection MUST add `smoke` as a required check too — otherwise a broken docs
  # build or interaction regression merges green again (the exact #2184 failure mode #2220 closed). Adding
  # `smoke` to the required set is a repo-admin action, not a code change; do it when this lands.
  #
  # It repeats the sibling-layout setup (checkout ×2 + both `npm ci` + FUI build:tools, ~25s) because
  # GitHub jobs don't share a workspace; that duplicated setup runs concurrently with `test`, so it costs
  # runner-minutes, not wall-clock. The `visual` job (below, disabled) already duplicates the same setup.
  smoke:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # xd1sfms (#4075/#3383) — same measurement pass: 15 successful runs sampled 2026-09-25 gave this job
    # (docs build + Playwright install + the interaction lane) min=129s max=146s p50=135s p95=146s —
    # 3x146s≈7.3min, rounded up to 10min.
    timeout-minutes: 10
    steps:
      - name: Gate on card-only detection
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes (card-only detection) did not succeed (result: ${{ needs.changes.result }}) - failing closed."
            exit 1
          fi
          if [ "${{ needs.changes.outputs.light }}" = "true" ]; then
            echo "Card-only PR: docs build + interaction lane intentionally not run."
          fi
      # Same sibling layout as `test` / deploy.yml — WE's `build:docs` shells out to FUI's render CLI.
      #   $GITHUB_WORKSPACE/web-everything  (this repo)
      #   $GITHUB_WORKSPACE/frontierui      (the tool sibling)
      - name: Checkout WE
        if: ${{ needs.changes.outputs.light != 'true' }}
        uses: actions/checkout@v4
        with:
          path: web-everything
      - name: Mint FUI read token (GitHub App)
        id: fui-app-token
        if: vars.WE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WE_APP_ID }}
          private-key: ${{ secrets.WE_APP_PRIVATE_KEY }}
          owner: frontier-ui
          repositories: frontierui
          permission-contents: read
      - name: Checkout FUI (sibling)
        if: ${{ needs.changes.outputs.light != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: frontier-ui/frontierui
          token: ${{ steps.fui-app-token.outputs.token || secrets.FUI_READ_TOKEN }}
          path: frontierui

      - uses: actions/setup-node@v4
        if: ${{ needs.changes.outputs.light != 'true' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-everything/package-lock.json
            frontierui/package-lock.json

      # FUI first (ratified #1946/#2016 ordering): the `@frontierui/*` alias resolves to sibling source and
      # `build:docs` calls the pinned component-render CLI produced by build:tools.
      - name: Install + build FUI tools
        if: ${{ needs.changes.outputs.light != 'true' }}
        working-directory: frontierui
        run: |
          npm ci
          npm run build:tools

      - name: Install
        if: ${{ needs.changes.outputs.light != 'true' }}
        working-directory: web-everything
        run: npm ci

      # Deploy smoke (#2220): `build:docs` is the exact artifact the Cloudflare deploy publishes. Before it
      # gated CI a broken docs build (e.g. the #2184 transforms.cjs mis-wire) merged green and silently
      # broke the deploy. FUI's render CLI is already built above, so this needs no extra setup; ~25s.
      - name: Build WE docs (deploy smoke)
        if: ${{ needs.changes.outputs.light != 'true' }}
        working-directory: web-everything
        run: npm run build:docs

      # Cache the Playwright browser bundle keyed on the installed @playwright/test version, so the ~19s
      # `playwright install` only re-downloads chromium when the version actually changes. `--with-deps`
      # (apt system libs) still runs each time — those aren't cacheable across runners — but the browser
      # download, the bulk of the cost, is served from cache on a hit.
      - name: Resolve Playwright version
        if: ${{ needs.changes.outputs.light != 'true' }}
        id: pw
        working-directory: web-everything
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: ${{ needs.changes.outputs.light != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Deterministic Playwright interaction lane (#2070): drives the client-side backlog-table behaviour
      # over a fixed fixture page served by tests/interaction/serve.mjs. WE_INTERACTION_ONLY skips the app
      # dev-server webServer entry (see playwright.config.ts) so no build/live-data is needed.
      - name: Install Playwright chromium
        if: ${{ needs.changes.outputs.light != 'true' }}
        working-directory: web-everything
        run: npx playwright install --with-deps chromium

      - name: Interaction lane
        if: ${{ needs.changes.outputs.light != 'true' }}
        working-directory: web-everything
        run: npm run test:interaction
        env:
          WE_INTERACTION_ONLY: "1"

  # Diff-driven test-selection MEASURE lane (#2681). The SHADOW full-suite compare that produces the false-green
  # signal the eventual default-on shrink reads — a false-green is a full-suite failure that fell OUTSIDE what
  # `vitest related` on the PR's diff would have run. This job is EVIDENCE-GATHERING, never a gate:
  #   • OFF BY DEFAULT (`if:` below) — runs only on manual dispatch or when the repo var
  #     `WE_MEASURE_TEST_SELECTION == '1'` is set. This is the DoD's "flag-gated; NOT defaulted until the measured
  #     false-green rate is acceptable": the required `test`/`smoke` gates and the `push:[main]` full-suite
  #     backstop are UNCHANGED; nothing here can block a merge (its own result is not a required check).
  #   • It runs the FULL suite once with the json reporter (the shadow full run), computes the diff-driven
  #     selection decision off the PINNED merge-base, and records whether any full-suite failure escaped the
  #     selected set — the false-green sample — as an artifact. `continue-on-error` so even a red shadow run only
  #     records; it never reds CI.
  # Widen the shrink allow-list / flip the default only once this lane's recorded false-green rate is acceptable.
  test-selection-measure:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.WE_MEASURE_TEST_SELECTION == '1' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    # xd1sfms (#4075/#3383) — this lane is OFF by default today (see the `if:` above), so no successful
    # run in the 2026-09-25 sample ever executed it (every sampled run shows it `skipped`) — no real p95
    # exists yet. Sized conservatively off its own steps instead: it runs the FULL unsharded unit suite
    # once (unlike `test-shard`'s 1/4 split) plus the full real-git integration suite, so budget well
    # above a single shard's 15min. `continue-on-error: true` already keeps a genuine timeout here from
    # ever reddening CI; this only stops a hang from tying up a runner for the 360-min default.
    timeout-minutes: 30
    steps:
      # Same sibling layout as `test` — the unit suite needs the FUI sibling for the `@frontierui/*` alias.
      # fetch-depth: 0 so `git merge-base origin/main HEAD` has the history the pinned-base diff needs (#2681).
      - name: Checkout WE
        uses: actions/checkout@v4
        with:
          path: web-everything
          fetch-depth: 0
      - name: Mint FUI read token (GitHub App)
        id: fui-app-token
        if: vars.WE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WE_APP_ID }}
          private-key: ${{ secrets.WE_APP_PRIVATE_KEY }}
          owner: frontier-ui
          repositories: frontierui
          permission-contents: read
      - name: Checkout FUI (sibling)
        uses: actions/checkout@v4
        with:
          repository: frontier-ui/frontierui
          token: ${{ steps.fui-app-token.outputs.token || secrets.FUI_READ_TOKEN }}
          path: frontierui

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-everything/package-lock.json
            frontierui/package-lock.json

      - name: Install + build FUI tools
        working-directory: frontierui
        run: |
          npm ci
          npm run build:tools

      - name: Install
        working-directory: web-everything
        run: npm ci

      # The shadow FULL run — the whole unit suite with the json reporter, so the measure step has per-file
      # pass/fail. `|| true`: a red shadow run must still record (the false-green signal LIVES in a red full run).
      - name: Shadow full-suite run (json report)
        working-directory: web-everything
        run: npx vitest run --reporter=json --outputFile=vitest-full.json || true

      # Record the false-green sample: decide off the diff, compare against the shadow full run's failures, append.
      - name: Record false-green signal (#2681)
        working-directory: web-everything
        run: node scripts/readiness/test-selection.mjs --measure --vitest-json=vitest-full.json
        env:
          # Evaluate the decision AS IF the shrink were on, so the measure reflects what shrink WOULD do —
          # without any real gate depending on it (this job gates nothing).
          WE_DIFF_TEST_SELECTION: "1"
          WE_FALSE_GREEN_LOG: false-green-log.json

      - name: Upload false-green sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: false-green-signal
          path: web-everything/false-green-log.json
          if-no-files-found: warn

      # Free byproduct of the shadow run above: per-test durations are already in vitest-full.json, this
      # job just never looked at them. Printed straight into the CI log (no artifact download needed) as an
      # early-warning signal for individual slow tests and files creeping up before they dominate a shard —
      # this job runs the SAME real-git/subprocess integration config as `npm run test:integration:vitest`
      # too, so both tiers are covered. Report-only: never fails the job.
      - name: Report slowest tests (unit)
        if: always()
        working-directory: web-everything
        run: node scripts/dev/report-slow-tests.mjs vitest-full.json --top=40 || true

      - name: Shadow integration-suite run (json report)
        if: always()
        working-directory: web-everything
        run: npx vitest run --config vitest.integration.config.ts --reporter=json --outputFile=vitest-integration.json || true

      - name: Report slowest tests (integration)
        if: always()
        working-directory: web-everything
        run: node scripts/dev/report-slow-tests.mjs vitest-integration.json --top=40 || true

  # Visual-regression guard (#2177 / #1966). Builds the docs site (same sibling layout as deploy.yml)
  # and runs `check:visual` against committed -chromium-linux baselines. Separate job so its ~2–3 min
  # build cost doesn't slow the fast `test` job. Runs on the same events (push/PR/dispatch).
  #
  # Baseline hygiene (#2235): committed PNGs under tests/visual/rendered-site-visual.spec.ts-snapshots/
  # are a SINGLE platform target — container-linux — not platform-branched; a prior darwin set was
  # dropped once rendering was pinned to the container (#2234). Refresh linux baselines via
  # `workflow_dispatch` on `.github/workflows/update-visual-baselines.yml` after an intentional look
  # change. A bare local `npm run check:visual:update` on a non-linux host writes `-chromium-<host
  # platform>.png` files that do NOT match the committed `-chromium-linux.png` baselines — do not commit
  # those; either run the refresh workflow above, or run the container image below locally (`docker run
  # --rm -v "$PWD/..:/workspace" -w /workspace/web-everything <the pinned image tag> …`, mirroring this
  # job's steps) to produce a real linux-matching baseline.
  visual:
    # DISABLED (#2232) pending the visual-regression rebuild epic. The gate has no committed
    # -chromium-linux baselines to compare against (they could never be seeded — the refresh workflow
    # hit the same :3000 timeout, and the #2179 verdict gate blocks a first-time seed), so it is
    # permanently red. A permanently-red *unrequired* job is pure noise that trains everyone to ignore CI
    # (it masked the #2184 breakage for ~6h). Turned off until the rebuild lands; the final slice #2240
    # re-enables it (and promotes it to a required, watched check). Do NOT flip this back on ad hoc —
    # re-enabling is gated on #2240's readiness (container-pinned baselines + PR-based refresh).
    if: ${{ false }}
    runs-on: ubuntu-latest
    # xd1sfms (#4075/#3383) — this job is DISABLED (`if: false` above), so no successful run exists in
    # the 2026-09-25 sample to measure a p95 from; the closest real data point (this same docs-build +
    # container-Playwright shape run via update-visual-baselines.yml) only ever reached a :3000-timeout
    # failure at ~2min15s before concluding, never a real full pass. Sized conservatively off the
    # `smoke` job's own docs-build+Playwright p95 (146s) plus real container-startup overhead, well
    # under the 360-min default; re-measure with real data once #2240 re-enables this job for real.
    timeout-minutes: 20
    # Version-locked Playwright container (#2234): pinned to the exact `@playwright/test` version in
    # package-lock.json so browsers + OS font/AA stack are byte-identical every run, on any host. The
    # image ships chromium pre-installed at this same version, so no separate browser-install step is
    # needed below (see the removed "Install Playwright chromium" step). Bump this tag in lockstep with
    # any `@playwright/test` upgrade — `npm run check:standards` fails loud on drift.
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-jammy
    steps:
      # Same sibling layout as deploy.yml — WE's build shells out to FUI's component-render CLI.
      #   $GITHUB_WORKSPACE/web-everything  (this repo)
      #   $GITHUB_WORKSPACE/frontierui      (the tool sibling)
      - name: Checkout WE
        uses: actions/checkout@v4
        with:
          path: web-everything
      - name: Mint FUI read token (GitHub App)
        id: fui-app-token
        if: vars.WE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WE_APP_ID }}
          private-key: ${{ secrets.WE_APP_PRIVATE_KEY }}
          owner: frontier-ui
          repositories: frontierui
          permission-contents: read
      - name: Checkout FUI (sibling)
        uses: actions/checkout@v4
        with:
          repository: frontier-ui/frontierui
          token: ${{ steps.fui-app-token.outputs.token || secrets.FUI_READ_TOKEN }}
          path: frontierui

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-everything/package-lock.json
            frontierui/package-lock.json

      # FUI tools first (ratified #1946/#2016 ordering) — produces the component-render CLI.
      - name: Install + build FUI tools
        working-directory: frontierui
        run: |
          npm ci
          npm run build:tools

      - name: Install WE
        working-directory: web-everything
        run: npm ci

      # Build the docs site so the visual spec has real rendered pages to screenshot.
      - name: Build WE docs
        working-directory: web-everything
        run: npm run build:docs

      # No "Install Playwright chromium" step here: the pinned container image already ships chromium
      # pre-built at the exact `@playwright/test` version above, so a separate `playwright install` would
      # be redundant (and could silently pull a *different* browser build if the pin ever drifted).

      # Serve the pre-built _site statically on :8080 (the visual spec's default port).
      # `npx serve` ships with Node and needs no extra install; `--single` avoids 404 on clean-URL routes.
      - name: Serve built site
        working-directory: web-everything
        run: npx serve _site --listen 8080 --single &
        shell: bash

      # Wait for the static server to be ready before running the visual tests.
      - name: Wait for site
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ && break
            sleep 1
          done

      # Visual regression — compares screenshots against the committed -chromium-linux baselines.
      # Fails if a baseline is missing (run update-visual-baselines.yml to generate linux baselines).
      # Upload the Playwright HTML report as an artifact on failure so regressions are inspectable.
      - name: Visual regression
        working-directory: web-everything
        run: npm run check:visual
        env:
          WE_ELEVENTY_PORT: "8080"
          # The site is pre-built and served statically on :8080 by the step above, so skip Playwright's
          # :3000 dev-server boot (playwright.config.ts webServer[0]) — it's unused by the visual specs and
          # times out in CI, failing the job. #2221.
          WE_PREBUILT_SITE: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: web-everything/playwright-report/
          retention-days: 7
