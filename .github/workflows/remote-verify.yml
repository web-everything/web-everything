name: Remote verify

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Targeted mode only — branch or SHA (empty uses the triggering SHA)
        type: string
        default: ''
      mode:
        description: Verification scope
        type: choice
        options: [lane-check, targeted, full]
        default: lane-check
      tests:
        description: Space-separated test files for targeted mode
        type: string
        default: ''
      operation:
        description: Operation whose related tests run in targeted mode
        type: string
        default: ''
  push:
    branches: ['lane/**']

permissions:
  contents: read

concurrency:
  group: remote-verify-${{ inputs.mode == 'targeted' && (inputs.ref || github.ref) || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ vars.WE_SHARD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web-everything
    steps:
      - name: Checkout WE
        uses: actions/checkout@v4
        with:
          path: web-everything
          fetch-depth: 0
          ref: ${{ inputs.mode == 'targeted' && (inputs.ref || github.sha) || github.sha }}
      - name: Verify checkout SHA
        if: ${{ inputs.mode != 'targeted' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      # Same sibling layout and tool build as CI's test job.
      - name: Checkout FUI (sibling)
        uses: actions/checkout@v4
        with:
          repository: frontier-ui/frontierui
          token: ${{ secrets.GITHUB_TOKEN }}
          path: frontierui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-everything/package-lock.json
            frontierui/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            web-everything/node_modules
            frontierui/node_modules
          key: remote-verify-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'web-everything/package-lock.json', 'frontierui/package-lock.json') }}
      - name: Install + build FUI tools
        working-directory: frontierui
        run: |
          npm ci
          npm run build:tools
      - name: Install
        run: npm ci
      # The importer accepts only a completed successful Required lane gate step.
      - name: ${{ inputs.mode == 'targeted' && 'Targeted tests' || 'Required lane gate' }}
        env:
          VERIFY_MODE: ${{ inputs.mode || 'lane-check' }}
          VERIFY_TESTS: ${{ inputs.tests }}
          VERIFY_OPERATION: ${{ inputs.operation }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { existsSync } from 'node:fs';
          const run = (file, args) => execFileSync(file, args, { stdio: 'inherit' });
          switch (process.env.VERIFY_MODE) {
            case 'lane-check':
              run('node', ['scripts/verify-lane.mjs', 'run']);
              break;
            case 'full':
              run('npm', ['run', 'check:standards']);
              run('npm', ['run', 'test:unit']);
              break;
            case 'targeted': {
              const tests = (process.env.VERIFY_TESTS || '').trim().split(/\s+/).filter(Boolean);
              const operation = (process.env.VERIFY_OPERATION || '').trim();
              if (tests.length) {
                if (tests.some((file) => file.startsWith('-') || !existsSync(file))) throw new Error('Expected existing test file paths');
                run('npm', ['run', 'test:unit', '--', ...tests]);
              } else {
                if (!/^[a-z][a-z0-9-]*$/.test(operation)) throw new Error('Targeted mode requires tests or an operation name');
                // Operation declarations and their IO bindings live beside each other.
                const declaration = `scripts/operations/${operation}.mjs`;
                if (!existsSync(declaration)) throw new Error('Unknown operation');
                const files = [declaration, `scripts/operations/${operation}-io.mjs`].filter(existsSync);
                run('node', ['scripts/readiness/heavy-admission.mjs', 'run', '--', 'npx', 'vitest', 'related', '--run', ...files]);
              }
              break;
            }
            default: throw new Error('Unknown verification mode');
          }
          NODE
